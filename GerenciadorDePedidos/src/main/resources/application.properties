spring.datasource.url=jdbc:postgresql://localhost/${DATABASE}
spring.datasource.username=${BANCO_USERNAME}
spring.datasource.password=${BANCO_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#Hibernate
hibernate.dialect=org.hibernate.dialect.HSQLDialect
spring.jpa.hibernate.ddl-auto=validate

server.error.include-stacktrace=never
server.port=8081

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Documenta só a API REST, não as páginas Thymeleaf
springdoc.paths-to-match=/api/**

# CORS: origens do front-end que podem chamar a API (separe por virgula)
app.cors.allowed-origins=http://localhost:3000

#Flyway: banco ja existe (criado pelo Hibernate), entao marca o estado atual como V1 e aplica a partir da V2
spring.flyway.baseline-on-migrate=true
