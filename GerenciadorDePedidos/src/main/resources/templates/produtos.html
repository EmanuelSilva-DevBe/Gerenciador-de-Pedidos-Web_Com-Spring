<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<div class="container-fluid">
    <body>
    <h1>Produtos Cadastrados</h1>

    <!-- Verifica se a lista está vazia -->
    <div th:if="${produtos.isEmpty()}">
        <p>Nenhum produto cadastrado ainda. Clique em "Cadastrar Novo Produto" para adicionar.</p>
    </div>


    <!-- Só mostra a tabela se tiver produtos -->
    <table class="table table-bordered" th:if="${!produtos.isEmpty()}">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Preço</th>
            <th>Descrição</th>
            <th>Quantidade em estoque</th>
        </tr>

        <tr  th:each="produto : ${produtos}">
            <td th:text="${produto.id}"></td>
            <td th:text="${produto.nomeProduto}"></td>
            <td th:text="'R$ ' + ${produto.precoProduto}"></td>
            <td th:text="${produto.descricaoProduto}"></td>
            <td th:text="${produto.quantidadeProduto} + ' unidades'"></td>
        </tr>
    </table>
    <br><br>
    <a th:href="@{/produtos/novo}">
        <button type="button" class="btn btn-outline-primary">Cadastrar novo produto</button>
    </a>

    <a th:href="@{/produtos/excluir}">
        <button type="button" class="btn btn-outline-danger">Excluir produto</button>
    </a>

    <a th:href=""
    <br><br>

</div>
</body>
</html>
