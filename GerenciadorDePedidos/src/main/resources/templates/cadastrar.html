<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div class="container-fluid">
    <h1>Cadastrar Novo Produto</h1>

    <form th:action="@{/produtos/salvar}" method="post">

        <div class="form-floating mb-3 mt-3">
        <input type="text" name="nomeProduto" class="form-control" id="NomeProduto" placeholder="Nome do Produto" required><br><br>
         <label for="NomeProduto">Nome Do Produto</label>
        </div>

        <div class="form-floating mb-3 mt-3">
        <input type="number" step="0.01" name="precoProduto" class="form-control" placeholder="Preço do produto" id="PrecoProduto" required><br><br>
            <label for="PrecoProduto">Preço do produto</label>
        </div>

        <div class="form-floating mb-3 mt-3">
        <input type="text" name="descricaoProduto" class="form-control" placeholder="Descrição" id="descricaoProduto" ></input><br><br>
            <label for="descricaoProduto">Descrição</label>
        </div>

        <button type="submit" class="btn btn-outline-success">Salvar</button>
        <a th:href="@{/produtos}">
            <button type="button" class="btn btn-outline-danger"> Cancelar </button>
        </a>
    </form>
</div>
</body>
</html>
